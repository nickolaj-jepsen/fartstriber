# Project policy, shared by every checkout. The [lint] table is part of each check's hash, so changing a
# threshold re-checks every design. Per-user settings are in the state dir (livery.example.toml).

# Output lint thresholds, in texture pixels at the kit's canvas size unless noted (livery/lint/output.py).
[lint]
off_car_px = 400
keep_clear_px = 64
# Keep-clear kinds text and logos must avoid. Nickolaj, 18 Oct 2026: his races don't stamp series
# decals, so the door's series-sponsor panel and the banners are usable (warnings only).
keep_clear_strict = ["number"]
near_tangent_px = 12
near_tangent_run_px = 40
min_feature_px = 6
min_stroke_px = 3
min_outline_px = 14                      # keylines and pinlines: 6-12 px ones vanished in the sim shots
min_text_px = 24
large_min_px = 60                        # a large-only brand's smallest height: roof, bonnet, door headlines
max_colours = 8                          # three hues in two or three tones, plus neutrals (livery-design)
seam_min_breaks = 3
seam_break_share = 0.4
number_colour = "#ffffff"
min_number_contrast = 3.0
# What the preview cameras see, from the kit's calibration capture (livery/visibility.py); warnings only.
max_texels_per_px = 3.0                  # more foreshortened than this in every view is not seen well
max_unseen_share = 0.2                   # of text, a sponsor or a mark where no view sees it well
min_screen_px = 8                        # across on screen: eva-unit01's 9 px pins read as faint in the sim
crease_kink = 0.3                        # a fold: the screen jumps off the line by this share of the step
crease_share = 0.15                      # of text, a sponsor or a mark beyond a crease that runs through it
max_hidden_detail_share = 0.5            # of a pattern's area where no view sees it well

[preview]
# The views `livery preview sim` shoots, in this order (the paint reloads framed at the first); each kit's
# profile.toml says how its car is shot from each.
views = ["front34", "side_l", "side_r", "rear34", "top"]
# The sim window's client size every sim run shoots at, for every kit: a capture maps window pixels to
# texels at one size, so it is part of the capture's identity.
window = [1780, 992]

[project]
name = "fartstriber"
version = "0.1.0"
description = "iRacing liveries designed as code"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "fonttools>=4.67",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "psd-tools>=1.25.0",
    "pyirsdk>=1.3.7",
    "python-socketio[client]>=5.11",
    "pyyaml>=6.0.3",
    "resvg-py==0.5.0",
    "scipy>=1.18.1",
    "shapely>=2.1",
    "typer>=0.16",
    "websocket-client>=1.8",
    "windows-capture>=2.0.1",
    "zstandard>=0.25.0",
]

[project.scripts]
livery = "livery.cli:main"

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pyrefly>=1.4.0",
    "pytest>=8.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livery"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT"]
ignore = [
    "E501",  # ruff format owns line length; the rest is prose
    "PT011",  # tests assert behaviour, not message text (CLAUDE.md), so no match=
]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
# One worker per physical core (psutil counts them; more is slower); an idle worker takes queued tests
# from a busy one, so the few long tests don't hold the rest up.
addopts = ["-n", "auto", "--dist", "worksteal"]

[tool.pyrefly]
project-includes = ["livery", "tests"]
project-excludes = ["tests/fixtures"]
python-version = "3.13"
baseline = "pyrefly-baseline.json"  # known errors; only new ones fail

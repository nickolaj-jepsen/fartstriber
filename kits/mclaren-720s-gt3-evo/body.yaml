# The kit's body model, written by `livery kit label` (never by hand); docs/architecture.md (Kits) says
# what each part and feature is for. Parts: whole islands, an island cut by a car-space polygon on one
# view (cut), or the rest of their islands once the other parts' cuts are out (rest). Groups paint parts
# together. Features: car-space geometry on one view; keep_clear and occluder count for the output lint.
parts:
  splitter_lip:
    islands: [i080]
    side: centre
    confidence: likely
    note: The splitter's vertical lip; designs' LIP = (i080, i083) is splitter_lip + splitter_top.
    evidence: 'sim shots front/side/high: the thin front and side edge of the splitter, wrapping back to each front
      wheel; never seen from straight above. kit maps: own top map u 0-0.138. designs: LIP in 5 designs.'
  splitter_top:
    islands: [i083]
    side: centre
    confidence: likely
    note: Reads as a band across the nose from the front; from above it is the splitter's upper face.
    evidence: 'sim shots top (6893 px, the front-most strip ahead of the bumper), front (the wide band above the
      lip); kit maps: own top map u 0-0.074. designs: eva-unit01 calls it ''the bumper under the grille''.'
  grille_upright_l:
    islands: [i147]
    side: left
    confidence: sure
    note: 'Its side map (u 0-0.04, v 0.08-0.34) claims more than the sim shows: u 0.008-0.04 is never seen.'
    evidence: 'sim shots front: vertical bar left of the central grille; side_l u 0-0.01; mirror i069. designs:
      sessions-B ''two upright bars in the grille opening''; eva-unit01 calls them bumper ''lower corners''.'
  grille_upright_r:
    islands: [i069]
    side: right
    confidence: sure
    evidence: sim shots front, side_r; mirror i147.
  grille_header:
    islands: [i024]
    side: centre
    confidence: likely
    evidence: 'UI view (354 px): the strip across the top of the central lower grille. designs: fireproof-v2 ''the
      strip over the crash-structure opening''.'
  crash_opening:
    islands: [i172]
    side: centre
    confidence: unsure
    note: Dark interior surfaces; paint barely reads.
    evidence: 'UI view: the inside of the central lower grille between the uprights and parts of the right intake;
      the UI also returns it on edge pixels. designs: fireproof-v2 ''the crash-structure opening''s inside and the
      wheel-arch liners''.'
  front_bumper_corner_l:
    islands: [i021]
    side: left
    confidence: sure
    note: Includes the horizontal bar over the left intake that is a separate island (i026) on the right.
    evidence: 'sim shots side_l (17557 px, u 0-0.133, v 0.08-0.63), front, high_l, front34; its right twin i020
      sits at the mirrored x in the same texture band. designs: sessions-B ''i020/i021 ... are the front bumper
      corners''.'
  front_bumper_corner_r:
    islands: [i020]
    side: right
    confidence: sure
    evidence: sim shots side_r (16136 px), high_r, front; UI view (6851 px).
  intake_bar_r:
    islands: [i026]
    side: right
    confidence: likely
    evidence: 'sim shots front, side_r (u -0.014-0.009, v 0.29-0.43); UI view: the bar over the right lower intake
      under the headlight. Its left twin is part of i021.'
  intake_strake_upper_l:
    islands: [i159]
    side: left
    confidence: sure
    evidence: 'sim shots front, high_l: upper fin in the left bumper intake; kit maps: top map w -0.64..-0.56; mirror
      i062. designs: STRAKES.'
  intake_strake_lower_l:
    islands: [i156]
    side: left
    confidence: sure
    evidence: 'sim shots front, high_l: lower fin; mirror i066. designs: STRAKES.'
  intake_strake_upper_r:
    islands: [i062]
    side: right
    confidence: sure
    evidence: 'sim shots front, high_r; U; kit maps top map w 0.50-0.64. designs: STRAKES.'
  intake_strake_lower_r:
    islands: [i066]
    side: right
    confidence: sure
    evidence: sim shots front, high_r; U.
  intake_edge_l:
    islands: [i157]
    side: left
    confidence: likely
    evidence: 'sim shots front (284 px): the diagonal strip on the left intake''s inner edge; mirror i056.'
  intake_edge_r:
    islands: [i056]
    side: right
    confidence: likely
    evidence: sim shots front34/front; mirror i157.
  intake_insert_r:
    islands: [i032]
    side: right
    confidence: likely
    evidence: 'UI view (783 px): the box inside the right lower intake, beside i026. designs: eva-nerv ''front intakes'',
      fireproof-v2 lower nose.'
  intake_insert_l:
    islands: [i033]
    side: left
    confidence: unsure
    note: The UI view shows only the right side.
    evidence: By its position in the texture (mirror of i032 about x 1520); measured only a few px.
  grille_side_l:
    islands: [i138]
    side: left
    confidence: unsure
    evidence: 'sim shots front (276 px): beside the left upright, inside the grille; mirror i070.'
  grille_side_r:
    islands: [i070]
    side: right
    confidence: unsure
    evidence: sim shots front34 (422 px); mirror i138.
  front_fender_l:
    islands: [i123]
    side: left
    confidence: sure
    evidence: 'sim shots side_l/high_l/top: the fender skin over the front arch; kit maps side_l u 0.077-0.284 v
      0.62-0.85 and top w -0.51..-0.26; mirror i072. designs: FENDER_SKINS.'
  front_fender_r:
    islands: [i072]
    side: right
    confidence: sure
    evidence: as i123; mirror i123.
  fender_nose_l:
    islands: [i120]
    side: left
    confidence: sure
    evidence: 'sim shots front/high_l/side_l: the fender''s front piece from the nose round the headlight to the
      arch front; kit maps side_l u 0-0.117 v 0.47-0.73; mirror i086. designs: FENDER_SKINS, fireproof-v2 ''nose-side
      pieces''.'
  fender_nose_r:
    islands: [i086]
    side: right
    confidence: sure
    evidence: as i120; mirror i120.
  fender_slats_l:
    islands: [i137, i130, i125, i122, i121]
    side: left
    confidence: sure
    evidence: 'sim shots high_l/side_l/top: five louvre slats along the fender crest, front to back; kit maps side_l
      u 0.12-0.27 v 0.73-0.88. designs: eva-nerv SLATS.'
  fender_slats_r:
    islands: [i085, i095, i100, i105, i108]
    side: right
    confidence: sure
    evidence: as left; mirror i137/i130/i125/i122/i121.
  fender_arch_vent:
    islands: [i049]
    side: both
    confidence: likely
    note: Painting it paints both cars' sides alike.
    evidence: 'sim shots both side shots and both high shots at u 0.131-0.143, v 0.63-0.70: one island drawn on
      both sides (no mirror partner).'
  fender_rear_l:
    islands: [i158]
    side: left
    confidence: likely
    note: i128's map also claims u 0.29-0.40, v 0.02-0.54 here; that i128 texture is never seen.
    evidence: 'sim shots side_l (16231 px) u 0.298-0.399 v 0.01-0.58: the panel behind the front wheel up to the
      door''s front edge; kit maps side_l; mirror i054.'
  fender_rear_r:
    islands: [i054]
    side: right
    confidence: likely
    evidence: as i158; mirror i158.
  door_l:
    islands: [i128]
    side: left
    confidence: likely
    cut:
      view: side_l
      polygon:
      - [0.27, 1.1]
      - [0.27, -0.1]
      - [0.552, -0.1]
      - [0.5521, 0.15]
      - [0.5719, 0.3]
      - [0.5874, 0.45]
      - [0.5986, 0.6]
      - [0.6056, 0.75]
      - [0.6083, 0.9]
      - [0.6052, 1.1]
    note: Door and haunch are one island; the part is the island cut by the shut lines.
    evidence: 'kit maps + shutlines.png: i128 ahead of the door''s rear shut line (u 0.552 at v 0.15 to 0.608 at
      v 0.9) and behind the i158 edge; sim shots side_l. designs: eva-unit01 SIDE_SKINS (door and haunch one island).'
  door_r:
    islands: [i046]
    side: right
    confidence: likely
    cut:
      view: side_r
      polygon:
      - [0.27, 1.1]
      - [0.27, -0.1]
      - [0.552, -0.1]
      - [0.5521, 0.15]
      - [0.5719, 0.3]
      - [0.5874, 0.45]
      - [0.5986, 0.6]
      - [0.6056, 0.75]
      - [0.6083, 0.9]
      - [0.6052, 1.1]
    evidence: as door_l; shut lines agree within 0.005 u.
  rear_haunch_l:
    islands: [i128]
    side: left
    confidence: likely
    rest: true
    note: The sim's door light panel sits on it at u 0.72-0.765, v 0.46-0.69.
    evidence: 'kit maps + shutlines.png: i128 behind the door shut line and above the intake crease; its up-facing
      top (top view, u 0.858-0.963, w -0.34..-0.08) is the same island.'
  rear_haunch_r:
    islands: [i046]
    side: right
    confidence: likely
    rest: true
    evidence: as left.
  intake_duct_l:
    islands: [i128]
    side: left
    confidence: likely
    cut:
      view: side_l
      polygon:
      - [0.552, -0.1]
      - [0.552, 0.15]
      - [0.555, 0.163]
      - [0.555, 0.1629]
      - [0.6, 0.2175]
      - [0.65, 0.2781]
      - [0.7, 0.3388]
      - [0.75, 0.3994]
      - [0.776, 0.4309]
      - [0.776, -0.1]
    evidence: 'kit maps + shutlines.png: i128 below the intake crease, from the door foot to the rear arch, around
      the side intake opening (u 0.585-0.65, v 0.05-0.2, no island).'
  intake_duct_r:
    islands: [i046]
    side: right
    confidence: likely
    cut:
      view: side_r
      polygon:
      - [0.552, -0.1]
      - [0.552, 0.15]
      - [0.555, 0.163]
      - [0.555, 0.1629]
      - [0.6, 0.2175]
      - [0.65, 0.2781]
      - [0.7, 0.3388]
      - [0.75, 0.3994]
      - [0.776, 0.4309]
      - [0.776, -0.1]
    evidence: as left.
  sill_strip_l:
    islands: [i174, i178]
    side: left
    confidence: sure
    note: 'The sill''s up-facing top: the high camera sees i174 (4112 px) far better than the square-on one (292
      px). Maps stop short of the outlines (designs paint them whole).'
    evidence: 'kit maps side_l: i174 u 0.431-0.711 v 0-0.038 and its front tip i178 u 0.403-0.428; sim shots side_l/high_l;
      mirror i045/i043. designs: eva-nerv SILL_STRIPS (i174, i178).'
  sill_strip_r:
    islands: [i045, i043]
    side: right
    confidence: sure
    evidence: 'kit maps side_r: i045 u 0.431-0.733, i043 u 0.395-0.427; sim shots side_r/high_r; mirror i174/i178.'
  side_intake_strip_l:
    islands: [i173]
    side: left
    confidence: sure
    note: Its rear half (u 0.52-0.61) is hidden from the high and three-quarter cameras by the intake's carbon blade.
    evidence: 'kit maps side_l u 0.43-0.617 v 0.004-0.193: the strip above the sill strip, rising into the side
      intake; sim shots side_l; mirror i039. designs: fireproof-v2/sponsor-roster/eva-unit01 ''the strip over the
      side intake'' (i173/i039).'
  side_intake_strip_r:
    islands: [i039]
    side: right
    confidence: sure
    evidence: kit maps side_r u 0.43-0.617 v 0.004-0.22; sim shots side_r; mirror i173.
  door_shoulder_l:
    islands: [i168]
    side: left
    confidence: sure
    evidence: 'kit maps top map u 0.268-0.597 w -0.575..-0.515: the up-facing strip along the door top / beltline;
      sim shots top/high_r; mirror i038.'
  door_shoulder_r:
    islands: [i038]
    side: right
    confidence: sure
    evidence: as left; mirror i168.
  haunch_corner_l:
    islands: [i154]
    side: left
    confidence: sure
    evidence: 'kit maps side_l u 0.945-1.0 v 0.73-0.82 (+ top map); sim shots top/high_l/chase: the haunch''s rear
      upper corner where it turns to the rear face; mirror i067.'
  haunch_corner_r:
    islands: [i067]
    side: right
    confidence: sure
    evidence: as left; mirror i154.
  rear_bumper_side_l:
    islands: [i160]
    side: left
    confidence: sure
    evidence: 'kit maps side_l u 0.913-1.0 v 0.155-0.777; sim shots side_l/high_l: behind the rear wheel; mirror
      i053.'
  rear_bumper_side_r:
    islands: [i053]
    side: right
    confidence: sure
    evidence: as left; mirror i160.
  cover_gutter_l:
    islands: [i131, i126]
    side: left
    confidence: unsure
    evidence: 'sim shots high_r/top a few hundred px: thin strips between the engine cover and the left buttress;
      mirror i096/i098.'
  cover_gutter_r:
    islands: [i096, i098]
    side: right
    confidence: unsure
    evidence: 'sim shots high_l/top: as left (top u 0.70-0.79, w 0.33-0.43).'
  mirror_shell_l:
    islands: [i150]
    side: left
    confidence: sure
    evidence: 'sim shots side_l/high/top/front: the left mirror; kit maps side_l u 0.352-0.39 v 0.966-1.0, top w
      -0.67..-0.59; mirror i073. designs: MIRRORS in 3 designs.'
  mirror_shell_r:
    islands: [i073]
    side: right
    confidence: sure
    evidence: as left; mirror i150.
  mirror_base_l:
    islands: [i146]
    side: left
    confidence: sure
    evidence: 'kit maps side_l u 0.355-0.391 v 0.89-0.966; sim shots side_l: the strip on the door under the mirror,
      hidden from the high camera by the shell; mirror i076. designs: MIRROR_STRIPS/eva-nerv FEATURES.'
  mirror_base_r:
    islands: [i076]
    side: right
    confidence: sure
    evidence: as left; mirror i146.
  mirror_stalk_l:
    islands: [i143]
    side: left
    confidence: unsure
    evidence: sim shots side_l/high_l a few px beside the mirror; texture neighbour of i150.
  mirror_stalk_r:
    islands: [i074]
    side: right
    confidence: unsure
    evidence: sim shots high_l (61 px) beside the right mirror; texture neighbour of i073.
  window_strip_l:
    islands: [i127]
    side: left
    confidence: unsure
    evidence: sim shots high_l/side_l under 70 px along the side window's lower frame; mirror i091.
  window_strip_r:
    islands: [i091]
    side: right
    confidence: unsure
    evidence: sim shots high_r/top a few px; mirror i127.
  bonnet_skin:
    islands: [i099]
    side: centre
    confidence: sure
    evidence: sim shots top/front/high (64459 px top); kit maps own top map u 0-0.232 |w| < 0.44. Holds the bonnet
      number.
  bonnet_vent:
    islands: [i004, i058, i152, i107]
    side: centre
    confidence: likely
    note: The vent opening is u 0.10-0.18, |w| < 0.24 on top. i004 carries a template banner block.
    evidence: 'sim shots top/front: i004 is the vent''s rear ramp (u 0.141-0.179 |w| < 0.23); high_l/high_r: i058
      and i152 are its inner side walls (M pair); i107 is never seen (the vent floor; the kit''s linear top map
      puts it at u 0.099-0.18 |w| < 0.24). designs: fireproof-v2 DUCT i004; eva-unit01 HUMP i107 ''no sim shot shows
      it''.'
  bonnet_pins:
    islands: [i050]
    side: both
    confidence: likely
    note: Painting it paints every pin.
    evidence: 'sim shots top/high/front: small dark pads at the bonnet''s corners and on the engine cover; one island
      drawn at every pin.'
  windscreen_frame:
    islands: [i064]
    side: centre
    confidence: likely
    evidence: 'sim shots high/top a few hundred px along the A-pillars and windscreen edge; kit maps top-rest map;
      designs: fireproof-v2 ''windscreen frame''.'
  windscreen:
    islands: [i103]
    side: centre
    confidence: unsure
    evidence: 'Never seen in any shot; the kit''s linear top map puts it at u 0.202-0.265 |w| < 0.36, under the
      windscreen glass. designs: fireproof-v2 calls it the cowl.'
  roof:
    islands: [i102, i078]
    side: centre
    confidence: likely
    cut:
      view: top
      polygon:
      - [0.2, -1.1]
      - [0.605, -1.1]
      - [0.605, 1.1]
      - [0.2, 1.1]
      islands: [i078]
    note: i078 is cut at the roof/engine-cover seam; behind it i078 is the buttresses.
    evidence: 'sim shots top/front/high: i102 is the roof''s front panel behind the windscreen header (own map u
      0.36-0.42); i078 carries on to the engine cover seam at u ~0.605 and also forms the pillars and window frames.
      designs: eva-unit01/eva-nerv ROOF = i102.'
  buttress_l:
    islands: [i078]
    side: left
    confidence: likely
    cut:
      view: top
      polygon:
      - [0.605, -1.1]
      - [1.0, -1.1]
      - [1.0, 0.0]
      - [0.605, 0.0]
    evidence: 'sim shots top/high_l/chase: i078 alongside the engine cover from the roof to the rear deck. designs:
      eva-unit01 REAR_DECK = i078 ''the roof''s rear, around the cover and over the rear haunches''.'
  buttress_r:
    islands: [i078]
    side: right
    confidence: likely
    cut:
      view: top
      polygon:
      - [0.605, 0.0]
      - [1.0, 0.0]
      - [1.0, 1.1]
      - [0.605, 1.1]
    evidence: as left.
  roof_dome:
    islands: [i059]
    side: right
    confidence: unsure
    evidence: 'sim shots top (489 px): a round piece on the roof right of the centreline (u 0.484-0.501, w 0.17-0.21);
      the sim''s rear34 shot shows a dome there.'
  roof_fin:
    islands: [i044]
    side: centre
    confidence: unsure
    evidence: sim shots side/high/front ~100-160 px at the roof's top centre (u 0.49-0.50).
  engine_cover:
    islands: [i104]
    side: centre
    confidence: sure
    evidence: 'sim shots top (96272 px)/high/chase; kit maps own top map u 0.603-0.971 |w| < 0.34. Includes the
      stepped louvres round the rear opening. designs: eva-unit01 COVER.'
  engine_cover_scoop:
    islands: [i114]
    side: centre
    confidence: likely
    evidence: 'sim shots top/high/chase: the small slot on the cover''s centreline at u 0.67-0.68.'
  rear_deck:
    islands: [i092]
    side: centre
    confidence: sure
    evidence: 'sim shots top/high/chase: the tail''s top behind the engine cover, carrying the swan necks; kit maps
      own map u 0.915-1.0. designs: fireproof-v2 calls it the rear lip.'
  rear_deck_lip:
    islands: [i094]
    side: centre
    confidence: likely
    evidence: 'sim shots chase (154 px): the thin strip under the rear deck''s trailing edge. designs: fireproof-v2
      ''the piece under it''.'
  rear_face:
    islands: [i003]
    side: centre
    confidence: sure
    evidence: 'sim shots chase (13069 px): the upper rear face round the tail lights; holds the rear number (keep_clear
      [1755,77,1811,126], on the car''s right). designs: TAIL in 4 designs.'
  rear_valance:
    islands: [i017]
    side: centre
    confidence: sure
    note: The diffuser itself is unpainted carbon.
    evidence: 'sim shots chase (8051 px): the lower rear face under i003, with the centre notch, above the carbon
      diffuser. designs: fireproof-v2; eva-unit01 calls it REAR_FACE ''above the bumper'', which is wrong: it is
      below i003.'
  tail_light_trim_l:
    islands: [i011]
    side: left
    confidence: likely
    evidence: 'sim shots chase/high_l: small crescent on the rear face''s left; mirror (by x) i012.'
  tail_light_trim_r:
    islands: [i012]
    side: right
    confidence: likely
    evidence: sim shots chase/high_r.
  wing_top:
    islands: [i016]
    side: centre
    confidence: sure
    evidence: 'sim shots top (63751 px)/high/chase. Holds a series_sponsor keep-clear block. designs: WING.'
  wing_bottom:
    islands: [i005]
    side: centre
    confidence: likely
    evidence: 'Same size as i016; seen only as the trailing-edge band from behind (chase 3513 px) and above. designs:
      WING = (i005, i016) ''the wing''s two surfaces''.'
  wing_endplate_l:
    islands: [i029, i028]
    side: left
    confidence: likely
    evidence: 'sim shots side_l: i029 is the left endplate''s outer face (5583 px); i028 its inner face, seen from
      the right side past the wing and from behind on the left. designs: ENDPLATES i027-i030.'
  wing_endplate_r:
    islands: [i030, i027]
    side: right
    confidence: likely
    evidence: 'sim shots side_r: i030 outer (5331 px); i027 inner, seen from the left side and from behind on the
      right.'
  swan_neck_l:
    islands: [i140]
    side: left
    confidence: likely
    evidence: 'UI view (685 px): a wing upright; texture half lower texture half (left). designs: SWAN_NECKS (i055,
      i140).'
  swan_neck_r:
    islands: [i055]
    side: right
    confidence: likely
    evidence: UI view (734 px); texture half upper half.
  swan_neck_tops:
    islands: [i006]
    side: both
    confidence: likely
    evidence: 'sim shots top/high/chase (~400 px each): the strips along both swan necks from the wing forward onto
      the rear deck at |w| ~0.26; one island drawn on both necks.'
  number_panels:
    islands: [i170, i175]
    side: unknown
    confidence: unsure
    note: Whatever they are, paint on them doesn't show in the preview cameras.
    evidence: 'Never seen in any shot or the UI view; each holds a kit number and a series_small block. designs:
      eva-nerv NUMBER_PLATES ''small number zones off the mapped views''.'
groups:
  front_panel_l: [front_fender_l, fender_nose_l, fender_slats_l]
  front_panel_r: [front_fender_r, fender_nose_r, fender_slats_r]
  front_bumper_l: [front_bumper_corner_l, intake_strake_upper_l, intake_strake_lower_l, intake_edge_l, intake_insert_l,
    grille_upright_l, grille_side_l]
  front_bumper_r: [front_bumper_corner_r, intake_bar_r, intake_strake_upper_r, intake_strake_lower_r, intake_edge_r,
    intake_insert_r, grille_upright_r, grille_side_r]
  splitter: [splitter_lip, splitter_top]
  intake_strakes: [intake_strake_upper_l, intake_strake_lower_l, intake_strake_upper_r, intake_strake_lower_r]
  sill_l: [sill_strip_l, side_intake_strip_l]
  sill_r: [sill_strip_r, side_intake_strip_r]
  mirror_l: [mirror_shell_l, mirror_base_l, mirror_stalk_l]
  mirror_r: [mirror_shell_r, mirror_base_r, mirror_stalk_r]
  mirrors: [mirror_shell_l, mirror_shell_r]
  wing: [wing_top, wing_bottom]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # windows-capture and pyirsdk ship Windows wheels only; nothing here needs iRacing.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no moving major tag
        with:
          version: "0.8.3"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check  # fails only on errors not in pyrefly-baseline.json
      - run: uv run pytest -q
